name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: 24

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-slim

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          runtime: node@${{ env.NODE_VERSION }}

      - name: Build site
        env:
          # Production-only output (indexing) is opt-in for main
          PUBLIC_SITE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: pnpm run build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets the action open a GitHub Deployment, so the deploy URL and
          # its status surface on GitHub instead of only in the job log.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "latest"
          command: >
            pages deploy dist
            --project-name=stock-indicators
