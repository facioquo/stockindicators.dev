name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@lts

      - name: Build site
        run: pnpm run build
        continue-on-error: true

      - name: Display environment info
        run: |
          echo "=== Environment Setup Complete ==="
          echo "✅ Node Version: $(node --version)"
          echo "✅ PNPM Version: $(pnpm --version)"
          echo "✅ Astro Version: $(pnpm exec astro --version 2>/dev/null || echo 'astro not available')"
          echo "=== Ready for Copilot Coding Agent Session ==="
