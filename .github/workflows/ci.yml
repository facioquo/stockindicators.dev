name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint ESLint
        run: pnpm run lint:eslint

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25

      - name: Build site
        run: pnpm run build
