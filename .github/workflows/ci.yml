name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint ESLint
        run: pnpm run lint:eslint

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25

      - name: Build site
        run: pnpm run build

      - name: Serve site
        run: |
          pnpm run preview --host 127.0.0.1 --port 4000 &
          npx --yes wait-on@9.5.1 --timeout 60000 http://127.0.0.1:4000/

      - name: Test accessibility
        run: >
          npx --yes pa11y-ci@5.0.0
          --config ./.pa11yci
          --sitemap http://127.0.0.1:4000/sitemap-0.xml
          --sitemap-find https://stockindicators.dev
          --sitemap-replace http://127.0.0.1:4000
